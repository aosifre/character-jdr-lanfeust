<main class="appearance-shell">
  <a class="back-link" routerLink="/settings">← Retour aux paramètres</a>
  <header><p class="eyebrow">JDR Lanfeust de Troy</p><h1>Apparence</h1><p>Personnalisez le thème et le style de police de l'application.</p></header>
  <form>
    <label for="fontStyle">Style de police global</label>
    <select id="fontStyle" [value]="settings().fontStyle" (change)="updateFontStyle($event)">
      <option value="lanfeust">Lanfeust (fantaisie)</option>
      <option value="classic">Classique (sans serif)</option>
      <option value="storybook">Conte (serif)</option>
      <option value="manuscript">Manuscrit (écriture)</option>
    </select>
    <label for="colorTheme">Thème de couleur</label>
    <select id="colorTheme" [value]="settings().theme" (change)="updateTheme($event)">
      <option value="light">Clair</option>
      <option value="dark">Sombre</option>
    </select>
    <p>Vos préférences sont mémorisées dans votre navigateur et appliquées à tous les écrans.</p>
  </form>
</main>
