<main class="skills-shell">
  <a class="back-link" [routerLink]="characterId ? ['/characters', characterId, 'otherscores'] : '/characters'">← Retour</a>
  <div class="heading"><p class="eyebrow">{{ character?.firstName }} {{ character?.lastName }}</p><h1>Compétences</h1><p>Choisissez {{ maximum }} compétences, soit 4 + votre Intelligence. Chaque compétence sélectionnée reçoit un degré de +1.</p></div>
  <form class="custom-skill-form" [formGroup]="skillForm" (ngSubmit)="addCustomSkill()">
    <label for="custom-skill-label">Ajouter une compétence personnalisée</label>
    <input id="custom-skill-label" formControlName="label" placeholder="Nom de la compétence" />
    <select formControlName="attributeOne" aria-label="Première caractéristique">@for (attribute of attributes; track attribute.key) {<option [value]="attribute.key">{{ attribute.label }}</option>}</select>
    <select formControlName="attributeTwo" aria-label="Deuxième caractéristique">@for (attribute of attributes; track attribute.key) {<option [value]="attribute.key">{{ attribute.label }}</option>}</select>
    <button class="button outline" type="submit">Ajouter</button>
  </form>
  <section class="skill-grid" aria-label="Choix des compétences">
    @for (skill of skills(); track skill.id) {
      <button class="skill-card" [class.selected]="isSelected(skill.id)" type="button" (click)="toggle(skill)">
        <span>{{ skill.label }}</span><strong>{{ getBonus(skill) + (isSelected(skill.id) ? 1 : 0) }}</strong><small>Bonus {{ getBonus(skill) }} · Degré {{ isSelected(skill.id) ? '+1' : '0' }}</small>
      </button>
    }
  </section>
  <footer><p>{{ selected.size }} / {{ maximum }} choisies</p><button class="button" type="button" [disabled]="selected.size !== maximum" (click)="save()">Valider le personnage</button></footer>
</main>
