<main class="allocation-shell">
  <a class="back-link" routerLink="/characters">← Annuler</a>
  <div class="allocation-heading">
    <p class="eyebrow">{{ character?.firstName }} {{ character?.lastName }}</p>
    <h1>Caractéristiques</h1>
    <p>Choisissez une caractéristique pour attribuer successivement 1, 2, 3, 4 puis 5 points.</p>
  </div>

  <section class="characteristic-grid" aria-label="Caractéristiques principales">
    @for (characteristic of characteristics; track characteristic.key) {
      <button
        class="characteristic-card"
        [class.assigned]="values[characteristic.key] > 0"
        type="button"
        (click)="selectCharacteristic(characteristic.key)"
      >
        <span>{{ characteristic.label }}</span>
        <strong>{{ values[characteristic.key] }}</strong>
      </button>
    }
  </section>

  <div class="allocation-footer">
    <p>{{ assignedCount }} / 5 caractéristiques réparties</p>
    <button class="button button-primary" type="button" [disabled]="assignedCount !== 5" (click)="save()">Valider</button>
  </div>
</main>
