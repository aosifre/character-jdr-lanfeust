<main class="flaws-shell">
  <a class="back-link" routerLink="/settings">← Retour aux paramètres</a>
  <header>
    <p class="eyebrow">JDR Lanfeust de Troy</p>
    <h1>Travers</h1>
    <p>Gérez les travers disponibles lors de la création des héros.</p>
  </header>
  <form [formGroup]="form" (ngSubmit)="add()">
    <input
      formControlName="title"
      placeholder="Titre du travers"
      aria-label="Titre du travers"
    /><textarea
      formControlName="description"
      placeholder="Description"
      aria-label="Description"
    ></textarea
    ><button class="button" type="submit">Ajouter</button>
  </form>
  <section class="flaw-list">
    @for (flaw of flaws(); track flaw.id) {
      <article>
        <div>
          <strong>{{ flaw.title }}</strong>
          <p>{{ flaw.description }}</p>
        </div>
        <button class="delete" type="button" (click)="remove(flaw.id)">Supprimer</button>
      </article>
    }
  </section>
  <footer>
    <button class="button outline" type="button" (click)="export()">Exporter</button
    ><label class="button outline" for="flaw-import">Importer</label
    ><input
      id="flaw-import"
      class="hidden"
      type="file"
      accept="application/json,.json"
      (change)="import($event)"
    />
    @if (importError) {
      <p role="alert">Fichier de travers invalide.</p>
    }
  </footer>
</main>
