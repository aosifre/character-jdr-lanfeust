<main class="skills-shell"><a class="back-link" routerLink="/characters">← Retour aux personnages</a><header><p class="eyebrow">JDR Lanfeust de Troy</p><h1>Compétences</h1><p>Gérez le catalogue utilisé lors de la création des héros.</p></header><form [formGroup]="form" (ngSubmit)="add()"><input formControlName="label" placeholder="Nom de la compétence" aria-label="Nom de la compétence" /><select formControlName="attributeOne" aria-label="Première caractéristique">@for (attribute of attributes; track attribute.key) {<option [value]="attribute.key">{{ attribute.label }}</option>}</select><select formControlName="attributeTwo" aria-label="Deuxième caractéristique">@for (attribute of attributes; track attribute.key) {<option [value]="attribute.key">{{ attribute.label }}</option>}</select><button class="button" type="submit">Ajouter</button></form><section class="skill-list">@for (skill of skills(); track skill.id) {<article><strong>{{ skill.label }}</strong><span>{{ skill.attributeOne }} + {{ skill.attributeTwo }}</span><button class="delete" type="button" (click)="remove(skill.id)">Supprimer</button></article>}</section><footer><button class="button outline" type="button" (click)="export()">Exporter</button><label class="button outline" for="skill-import">Importer</label><input id="skill-import" class="hidden" type="file" accept="application/json,.json" (change)="import($event)" />@if (importError) {<p role="alert">Fichier de compétences invalide.</p>}</footer></main>
